# XcodeGen spec for the HeaterMeter iOS app.
#
#   brew install xcodegen          # one time
#   cd ios && xcodegen generate    # writes HeaterMeter.xcodeproj
#   open HeaterMeter.xcodeproj     # set your signing Team, then Run
#
# The .xcodeproj is generated (not committed) so it never drifts from this file.
# Two targets: the app, and a widget extension hosting the cook Live Activity
# (Lock Screen + Dynamic Island). `Shared/` is compiled into both.
name: HeaterMeter
options:
  bundleIdPrefix: dev.tallack
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  HeaterMeter:
    type: application
    platform: iOS
    sources:
      - path: HeaterMeter
      - path: Shared
    dependencies:
      - target: HeaterMeterWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tallack.heatermeter
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        GENERATE_INFOPLIST_FILE: NO
    # Push needs the entitlement (and a signing Team) on a device; the simulator
    # builds without it and falls back to local-only Live Activity updates.
    entitlements:
      path: HeaterMeter/HeaterMeter.entitlements
      properties:
        aps-environment: development
    info:
      path: HeaterMeter/Info.plist
      properties:
        CFBundleDisplayName: HeaterMeter
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes:
          - remote-notification
        # The Pi serves plain HTTP on the LAN; allow local-network HTTP without
        # disabling ATS globally. (For a Tailscale/hostname or remote setup, use
        # HTTPS or add a per-domain ATS exception instead.)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Ready for optional Bonjour discovery of the daemon on the LAN.
        NSLocalNetworkUsageDescription: "Find your HeaterMeter on the local network."
        NSBonjourServices:
          - _http._tcp
  HeaterMeterWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HeaterMeterWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tallack.heatermeter.widgets
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    info:
      path: HeaterMeterWidgets/Info.plist
      properties:
        CFBundleDisplayName: HeaterMeter
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
